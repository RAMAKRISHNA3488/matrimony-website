<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="maleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7A1635" />
      <stop offset="100%" stop-color="#4D091F" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F2C79D" />
      <stop offset="100%" stop-color="#D9A066" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="60" cy="60" r="60" fill="url(#maleGrad)" />
  
  <!-- Subtle Border Ring -->
  <circle cx="60" cy="60" r="58" fill="none" stroke="#FFD700" stroke-width="2" stroke-opacity="0.4" />
  
  <!-- Shoulders & Torso -->
  <path d="M22 110 C22 84, 40 76, 60 76 C80 76, 98 84, 98 110 Z" fill="#FBF8F2" />
  
