  <!-- Head & Neck -->
  <rect x="52" y="60" width="16" height="18" rx="4" fill="url(#skinGrad)" />
  <ellipse cx="60" cy="45" rx="20" ry="24" fill="url(#skinGrad)" />
  
  <!-- Hair -->
  <path d="M40 42 C40 26, 50 20, 60 20 C70 20, 80 26, 80 42 C76 34, 68 32, 60 32 C52 32, 44 34, 40 42 Z" fill="#2B1810" />
  
  <!-- Tilak / Traditional Bindi -->
